services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tenant
      POSTGRES_PASSWORD: tenant
      POSTGRES_DB: tenant
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenant -d tenant"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:4.2-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: tenant
      RABBITMQ_DEFAULT_PASS: tenant
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  controlplane:
    restart: unless-stopped
    build: {context: ., target: controlplane}
    environment:
      DATABASE_URL: postgres://tenant:tenant@postgres:5432/tenant?sslmode=disable
      RABBITMQ_URL: amqp://tenant:tenant@rabbitmq:5672/
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    restart: unless-stopped
    build: {context: ., target: worker}
    environment:
      RABBITMQ_URL: amqp://tenant:tenant@rabbitmq:5672/
      FAIL_RATE: "${FAIL_RATE:-0}"
      MIN_DELAY_MS: "${MIN_DELAY_MS:-300}"
      MAX_DELAY_MS: "${MAX_DELAY_MS:-800}"
    depends_on:
      rabbitmq:
        condition: service_healthy

  inject:
    profiles: ["tools"]
    build: {context: ., target: inject}
    environment:
      RABBITMQ_URL: amqp://tenant:tenant@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy

  test:
    profiles: ["test"]
    build: {context: ., target: test}
    environment:
      DATABASE_URL: postgres://tenant:tenant@postgres-test:5432/tenant_test?sslmode=disable
      RABBITMQ_URL: amqp://tenant:tenant@rabbitmq-test:5672/
    depends_on:
      postgres-test:
        condition: service_healthy
      rabbitmq-test:
        condition: service_healthy

  postgres-test:
    profiles: ["test"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tenant
      POSTGRES_PASSWORD: tenant
      POSTGRES_DB: tenant_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenant -d tenant_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  rabbitmq-test:
    profiles: ["test"]
    image: rabbitmq:4.2-management
    environment:
      RABBITMQ_DEFAULT_USER: tenant
      RABBITMQ_DEFAULT_PASS: tenant
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
  rabbitmqdata:
